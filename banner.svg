<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <!-- Accent Gradient for title -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Drop shadow for shield -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark background rectangle -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="12" ry="12" />

  <!-- Subtle decorative circles -->
  <circle cx="700" cy="30" r="40" fill="#ffffff" opacity="0.05" />
  <circle cx="100" cy="180" r="60" fill="#ffffff" opacity="0.03" />
  <circle cx="750" cy="170" r="25" fill="#00c6ff" opacity="0.08" />

  <!-- === SMALLER SHIELD (fully inside the banner) === -->
  <g transform="translate(55, 45)" filter="url(#shadow)">
    <!-- Shield body (smaller, scaled) -->
    <path d="M35,0 L70,18 L70,70 C70,105 35,140 35,140 C35,140 0,105 0,70 L0,18 Z" 
          fill="url(#shieldGrad)" stroke="#ff8080" stroke-width="1.8" />
    <!-- Inner highlight -->
    <path d="M35,8 L65,23 L65,70 C65,100 35,130 35,130 C35,130 5,100 5,70 L5,23 Z" 
          fill="none" stroke="#ff9999" stroke-width="0.8" opacity="0.4" />
    <!-- Crossed swords (scaled down) -->
    <g transform="translate(35, 70)" opacity="0.9">
      <!-- Left sword -->
      <line x1="-18" y1="-22" x2="18" y2="22" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round" />
      <!-- Right sword -->
      <line x1="18" y1="-22" x2="-18" y2="22" stroke="#e0e0e0" stroke-width="3.5" stroke-linecap="round" />
      <!-- Sword handles -->
      <rect x="-7" y="18" width="14" height="7" rx="2" fill="#d4af37" stroke="#b8960c" stroke-width="0.8" />
      <rect x="-7" y="-25" width="14" height="7" rx="2" fill="#d4af37" stroke="#b8960c" stroke-width="0.8" />
      <!-- Center gem -->
      <circle cx="0" cy="0" r="6" fill="#ff6666" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Title -->
  <text x="155" y="75" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="44" fill="url(#accentGrad)" filter="url(#glow)">DNS Fighter</text>

  <!-- Tagline -->
  <text x="155" y="108" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="16" fill="#b0b0d0">Multi-DNS Resolver &amp; Hosts Updater</text>

  <!-- Feature badges (repositioned slightly to the right) -->
  <g transform="translate(155, 128)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="22" rx="11" fill="#1a1a3e" stroke="#00c6ff" stroke-width="1.5" opacity="0.9" />
    <circle cx="14" cy="11" r="5" fill="#00c6ff" />
    <text x="27" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c0c0e0" font-weight="600">DNS Poisoning Protection</text>

    <!-- Badge 2 -->
    <rect x="188" y="0" width="120" height="22" rx="11" fill="#1a1a3e" stroke="#ff4d4d" stroke-width="1.5" opacity="0.9" />
    <circle cx="202" cy="11" r="5" fill="#ff4d4d" />
    <text x="215" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c0c0e0" font-weight="600">Multi‑Threaded</text>

    <!-- Badge 3 -->
    <rect x="316" y="0" width="120" height="22" rx="11" fill="#1a1a3e" stroke="#ffaa00" stroke-width="1.5" opacity="0.9" />
    <circle cx="330" cy="11" r="5" fill="#ffaa00" />
    <text x="343" y="15" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#c0c0e0" font-weight="600">Auto‑Update</text>
  </g>

  <!-- Rocket / Speed icon (moved slightly right to balance) -->
  <g transform="translate(700, 95)" opacity="0.85">
    <path d="M25,32 L38,16 L51,32 L38,48 Z" fill="#ff4d4d" />
    <path d="M38,8 L42,16 L34,16 Z" fill="#ffaa00" />
    <line x1="38" y1="16" x2="38" y2="48" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,2" />
    <text x="38" y="65" font-family="Arial, sans-serif" font-size="11" fill="#00c6ff" text-anchor="middle" font-weight="bold">FAST</text>
  </g>

  <!-- Bottom decorative line -->
  <line x1="155" y1="165" x2="750" y2="165" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5" />
</svg>
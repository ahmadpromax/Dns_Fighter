<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
    <!-- Accent Gradient (for the title) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Shadow for Shield -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="12" ry="12" />

  <!-- Decorative Elements -->
  <circle cx="700" cy="30" r="40" fill="#ffffff" opacity="0.05" />
  <circle cx="100" cy="180" r="60" fill="#ffffff" opacity="0.03" />
  <circle cx="750" cy="170" r="25" fill="#00c6ff" opacity="0.1" />

  <!-- Enhanced Shield Icon -->
  <g transform="translate(50, 40)" filter="url(#shadow)">
    <!-- Main Shield Shape -->
    <path d="M50,0 L100,25 L100,95 C100,145 50,190 50,190 C50,190 0,145 0,95 L0,25 Z" 
          fill="url(#shieldGrad)" stroke="#ff8080" stroke-width="2"/>
    <!-- Shield Inner Highlight -->
    <path d="M50,10 L90,32 L90,95 C90,140 50,180 50,180 C50,180 10,140 10,95 L10,32 Z" 
          fill="none" stroke="#ff9999" stroke-width="1" opacity="0.4"/>
    <!-- Crossed Swords Overlay -->
    <g transform="translate(50, 95)" opacity="0.9">
      <!-- Left Sword -->
      <line x1="-25" y1="-30" x2="25" y2="30" stroke="#e0e0e0" stroke-width="5" stroke-linecap="round"/>
      <!-- Right Sword -->
      <line x1="25" y1="-30" x2="-25" y2="30" stroke="#e0e0e0" stroke-width="5" stroke-linecap="round"/>
      <!-- Sword Handles -->
      <rect x="-10" y="25" width="20" height="10" rx="3" fill="#d4af37" stroke="#b8960c" stroke-width="1"/>
      <rect x="-10" y="-35" width="20" height="10" rx="3" fill="#d4af37" stroke="#b8960c" stroke-width="1"/>
      <!-- Center Gem -->
      <circle cx="0" cy="0" r="8" fill="#ff6666" stroke="#ffffff" stroke-width="2"/>
    </g>
  </g>

  <!-- Main Title -->
  <text x="170" y="75" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="46" fill="url(#accentGrad)" filter="url(#glow)">DNS Fighter</text>

  <!-- Tagline -->
  <text x="170" y="110" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="16" fill="#b0b0d0">Multi-DNS Resolver &amp; Hosts Updater</text>

  <!-- Feature Badges -->
  <g transform="translate(170, 130)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="24" rx="12" fill="#1a1a3e" stroke="#00c6ff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="16" cy="12" r="6" fill="#00c6ff"/>
    <text x="30" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c0c0e0" font-weight="600">DNS Poisoning Protection</text>

    <!-- Badge 2 -->
    <rect x="190" y="0" width="130" height="24" rx="12" fill="#1a1a3e" stroke="#ff4d4d" stroke-width="1.5" opacity="0.9"/>
    <circle cx="206" cy="12" r="6" fill="#ff4d4d"/>
    <text x="220" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c0c0e0" font-weight="600">Multi‑Threaded</text>

    <!-- Badge 3 -->
    <rect x="330" y="0" width="130" height="24" rx="12" fill="#1a1a3e" stroke="#ffaa00" stroke-width="1.5" opacity="0.9"/>
    <circle cx="346" cy="12" r="6" fill="#ffaa00"/>
    <text x="360" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#c0c0e0" font-weight="600">Auto‑Update</text>
  </g>

  <!-- Side Rocket / Speed Icon -->
  <g transform="translate(680, 100)" opacity="0.9">
    <path d="M30,40 L45,20 L60,40 L45,60 Z" fill="#ff4d4d" />
    <path d="M45,10 L50,20 L40,20 Z" fill="#ffaa00" />
    <line x1="45" y1="20" x2="45" y2="60" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4,2" />
    <text x="45" y="80" font-family="Arial, sans-serif" font-size="12" fill="#00c6ff" text-anchor="middle" font-weight="bold">FAST</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="170" y1="170" x2="750" y2="170" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto">
  <rect width="900" height="380" fill="#0d1117" rx="10"/>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">Architecture Comparison: Normal DNS vs DNS Fighter</text>

  <!-- ================= LEFT COLUMN ================= -->
  <g transform="translate(20, 50)">
    <!-- Card background -->
    <rect width="420" height="300" fill="#161b22" stroke="#ff4d4d" stroke-width="2" rx="8"/>
    <rect width="420" height="36" fill="#ff4d4d" rx="8"/>
    <text x="210" y="24" font-family="Arial" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">❌ Without DNS Fighter</text>

    <!-- Browser -->
    <rect x="30" y="60" width="100" height="34" fill="#1f1f2e" stroke="#555" stroke-width="1" rx="6"/>
    <text x="80" y="82" font-family="Arial" font-size="14" fill="#e0e0e0" text-anchor="middle">🌐 Browser</text>
    <!-- Arrow -->
    <line x1="130" y1="77" x2="170" y2="77" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrowRed)"/>
    <!-- DNS Request -->
    <rect x="175" y="60" width="110" height="34" fill="#1f1f2e" stroke="#555" stroke-width="1" rx="6"/>
    <text x="230" y="82" font-family="Arial" font-size="13" fill="#e0e0e0" text-anchor="middle">📡 DNS Request</text>

    <!-- Down arrow -->
    <line x1="230" y1="94" x2="230" y2="120" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowYellow)"/>
    <text x="240" y="110" font-family="Arial" font-size="11" fill="#ffaa00">DPI intercepts</text>

    <!-- DPI box -->
    <rect x="130" y="125" width="200" height="45" fill="#2a1a1a" stroke="#ff4d4d" stroke-width="1" rx="6"/>
    <text x="230" y="143" font-family="Arial" font-size="12" fill="#ffaa00" text-anchor="middle">⚠️ Deep Packet Inspection</text>
    <text x="230" y="160" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">Reads request → sends fake IP</text>

    <!-- Down arrow -->
    <line x1="230" y1="170" x2="230" y2="200" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Fake Website -->
    <rect x="150" y="205" width="160" height="40" fill="#1f1f2e" stroke="#ff4d4d" stroke-width="1" rx="6"/>
    <text x="230" y="225" font-family="Arial" font-size="13" fill="#ff4d4d" text-anchor="middle">🎭 Fake Website</text>
    <text x="230" y="240" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">(Phishing / Blocked)</text>

    <!-- Stats -->
    <rect x="15" y="265" width="390" height="25" fill="#000" opacity="0.6" rx="4"/>
    <text x="25" y="282" font-family="Arial" font-size="11" fill="#ccc">
      ⏱️ DNS delay: 20‑100 ms &nbsp;|&nbsp; 🔓 Poisoning risk: High &nbsp;|&nbsp; 👁️ Privacy: Visible
    </text>
  </g>

  <!-- ================= RIGHT COLUMN ================= -->
  <g transform="translate(460, 50)">
    <rect width="420" height="300" fill="#161b22" stroke="#00c6ff" stroke-width="2" rx="8"/>
    <rect width="420" height="36" fill="#00c6ff" rx="8"/>
    <text x="210" y="24" font-family="Arial" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">✅ With DNS Fighter</text>

    <!-- Browser -->
    <rect x="30" y="60" width="100" height="34" fill="#1f1f2e" stroke="#555" stroke-width="1" rx="6"/>
    <text x="80" y="82" font-family="Arial" font-size="14" fill="#e0e0e0" text-anchor="middle">🌐 Browser</text>
    <!-- Arrow -->
    <line x1="130" y1="77" x2="170" y2="77" stroke="#00c6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
    <!-- hosts file -->
    <rect x="175" y="60" width="110" height="34" fill="#1f1f2e" stroke="#00c6ff" stroke-width="2" rx="6"/>
    <text x="230" y="82" font-family="Arial" font-size="13" fill="#00c6ff" text-anchor="middle" font-weight="bold">📁 hosts file</text>

    <!-- Down arrow -->
    <line x1="230" y1="94" x2="230" y2="120" stroke="#00c6ff" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
    <text x="240" y="110" font-family="Arial" font-size="11" fill="#00c6ff">No DNS request sent</text>

    <!-- DPI cannot see -->
    <rect x="130" y="125" width="200" height="45" fill="#1a3a2a" stroke="#00c6ff" stroke-width="1" rx="6"/>
    <text x="230" y="143" font-family="Arial" font-size="12" fill="#00c6ff" text-anchor="middle">🛡️ DPI cannot see</text>
    <text x="230" y="160" font-family="Arial" font-size="10" fill="#aaa" text-anchor="middle">No spoofing → direct connection</text>

    <!-- Down arrow -->
    <line x1="230" y1="170" x2="230" y2="200" stroke="#00c6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Real Website -->
    <rect x="150" y="205" width="160" height="40" fill="#1f1f2e" stroke="#00c6ff" stroke-width="1" rx="6"/>
    <text x="230" y="225" font-family="Arial" font-size="13" fill="#00c6ff" text-anchor="middle">✅ Real Website</text>

    <!-- Stats -->
    <rect x="15" y="265" width="390" height="25" fill="#000" opacity="0.6" rx="4"/>
    <text x="25" y="282" font-family="Arial" font-size="11" fill="#ccc">
      ⚡ DNS delay: <tspan fill="#00c6ff">0 ms</tspan> &nbsp;|&nbsp; 🔒 Poisoning risk: <tspan fill="#00c6ff">None</tspan> &nbsp;|&nbsp; 👁️ Privacy: <tspan fill="#00c6ff">Perfect</tspan>
    </text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00c6ff"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffaa00"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="450" y="370" font-family="Arial" font-size="12" fill="#b0b0d0" text-anchor="middle">
    💡 DNS Fighter stores resolved IPs directly into your hosts file, eliminating DNS lookups and blocking DPI‑based spoofing.
  </text>
</svg>
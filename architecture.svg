<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="redHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4d4d"/>
      <stop offset="100%" style="stop-color:#b30000"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff"/>
      <stop offset="100%" style="stop-color:#0055cc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d4d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00c6ff"/>
    </marker>
  </defs>

  <rect width="900" height="380" fill="url(#bg)" rx="12"/>

  <!-- Main Title -->
  <text x="450" y="35" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">🛡️ Architecture Comparison: Normal DNS vs DNS Fighter</text>

  <!-- ================= LEFT COLUMN (Without DNS Fighter) ================= -->
  <g transform="translate(25, 60)">
    <rect width="415" height="290" rx="10" fill="#0d1117" stroke="#ff4d4d" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="415" height="40" rx="10" fill="url(#redHeader)"/>
    <text x="207" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">❌ Without DNS Fighter</text>

    <!-- Browser -->
    <rect x="30" y="60" width="100" height="36" rx="6" fill="#1f1f2e" stroke="#555" stroke-width="1.5"/>
    <text x="80" y="83" font-family="Arial" font-size="14" fill="#e0e0e0" text-anchor="middle">🌐 Browser</text>

    <line x1="130" y1="78" x2="175" y2="78" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- DNS Request -->
    <rect x="180" y="60" width="110" height="36" rx="6" fill="#1f1f2e" stroke="#555" stroke-width="1.5"/>
    <text x="235" y="83" font-family="Arial" font-size="13" fill="#e0e0e0" text-anchor="middle">📡 DNS Request</text>

    <!-- Down to DPI -->
    <line x1="235" y1="96" x2="235" y2="125" stroke="#ffaa00" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="245" y="114" font-family="Arial" font-size="11" fill="#ffaa00" font-weight="bold">DPI intercepts</text>

    <!-- DPI Box -->
    <rect x="135" y="130" width="200" height="45" rx="6" fill="#2a1a1a" stroke="#ff4d4d" stroke-width="1.5"/>
    <text x="235" y="150" font-family="Arial" font-size="12" fill="#ffaa00" text-anchor="middle" font-weight="bold">⚠️ Deep Packet Inspection</text>
    <text x="235" y="166" font-family="Arial" font-size="11" fill="#aaa" text-anchor="middle">Reads request → sends fake IP</text>

    <!-- Down to Fake Website -->
    <line x1="235" y1="175" x2="235" y2="205" stroke="#ff4d4d" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Fake Website -->
    <rect x="150" y="210" width="170" height="40" rx="6" fill="#1f1f2e" stroke="#ff4d4d" stroke-width="1.5"/>
    <text x="235" y="230" font-family="Arial" font-size="13" fill="#ff4d4d" text-anchor="middle" font-weight="bold">🎭 Fake Website</text>
    <text x="235" y="245" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">(Phishing / Blocked)</text>

    <!-- Stats -->
    <rect x="15" y="265" width="385" height="20" rx="4" fill="#000" opacity="0.6"/>
    <text x="25" y="279" font-family="Arial" font-size="11" fill="#ccc">
      ⏱️ DNS delay: 20‑100 ms &nbsp;|&nbsp; 🔓 Poisoning risk: High &nbsp;|&nbsp; 👁️ Privacy: Visible
    </text>
  </g>

  <!-- ================= RIGHT COLUMN (With DNS Fighter) ================= -->
  <g transform="translate(460, 60)">
    <rect width="415" height="290" rx="10" fill="#0d1117" stroke="#00c6ff" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="415" height="40" rx="10" fill="url(#blueHeader)"/>
    <text x="207" y="26" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">✅ With DNS Fighter</text>

    <!-- Browser -->
    <rect x="30" y="60" width="100" height="36" rx="6" fill="#1f1f2e" stroke="#555" stroke-width="1.5"/>
    <text x="80" y="83" font-family="Arial" font-size="14" fill="#e0e0e0" text-anchor="middle">🌐 Browser</text>

    <line x1="130" y1="78" x2="175" y2="78" stroke="#00c6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- hosts file -->
    <rect x="180" y="60" width="110" height="36" rx="6" fill="#1f1f2e" stroke="#00c6ff" stroke-width="2"/>
    <text x="235" y="83" font-family="Arial" font-size="13" fill="#00c6ff" text-anchor="middle" font-weight="bold">📁 hosts file</text>

    <!-- Down – no DNS request -->
    <line x1="235" y1="96" x2="235" y2="125" stroke="#00c6ff" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
    <text x="245" y="114" font-family="Arial" font-size="11" fill="#00c6ff" font-weight="bold">No DNS request sent</text>

    <!-- DPI cannot see -->
    <rect x="135" y="130" width="200" height="45" rx="6" fill="#1a3a2a" stroke="#00c6ff" stroke-width="1.5"/>
    <text x="235" y="150" font-family="Arial" font-size="12" fill="#00c6ff" text-anchor="middle" font-weight="bold">🛡️ DPI cannot see</text>
    <text x="235" y="166" font-family="Arial" font-size="11" fill="#aaa" text-anchor="middle">No spoofing → direct connection</text>

    <!-- Down to Real Website -->
    <line x1="235" y1="175" x2="235" y2="205" stroke="#00c6ff" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Real Website -->
    <rect x="150" y="210" width="170" height="40" rx="6" fill="#1f1f2e" stroke="#00c6ff" stroke-width="1.5"/>
    <text x="235" y="230" font-family="Arial" font-size="13" fill="#00c6ff" text-anchor="middle" font-weight="bold">✅ Real Website</text>

    <!-- Stats -->
    <rect x="15" y="265" width="385" height="20" rx="4" fill="#000" opacity="0.6"/>
    <text x="25" y="279" font-family="Arial" font-size="11" fill="#ccc">
      ⚡ DNS delay: <tspan fill="#00c6ff">0 ms</tspan> &nbsp;|&nbsp; 🔒 Poisoning risk: <tspan fill="#00c6ff">None</tspan> &nbsp;|&nbsp; 👁️ Privacy: <tspan fill="#00c6ff">Perfect</tspan>
    </text>
  </g>

  <!-- Bottom note -->
  <text x="450" y="370" font-family="Arial" font-size="12" fill="#b0b0d0" text-anchor="middle">
    💡 DNS Fighter stores resolved IPs directly into your hosts file, eliminating DNS lookups and blocking DPI‑based spoofing.
  </text>
</svg>
